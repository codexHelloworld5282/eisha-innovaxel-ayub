<!DOCTYPE html>
<html>
<head>
    <title>URL Shortener</title>
</head>
<body>
    <h2>URL Shortener</h2>

    {% if msg %}
        <p>Status: {{ code }} - {{ msg }}</p>
    {% endif %}

    <form method="post" action="/shorten">
        <input type="text" name="url" placeholder="Enter long URL" required>
        <input type="text" name="customCode" placeholder="Custom code (optional)">
        <button type="submit">Create Short URL</button>
    </form>

    <h3>All URLs</h3>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Original URL</th>
            <th>Short URL</th>
            <th>Count</th>
            <th>Actions</th>
        </tr>
        {% for url in urls %}
        <tr>
            <td>{{ url[0] }}</td>
            <td>
                <a href="/go/{{ url[0] }}" target="_blank">
                    {{ url[1][:50] }}{% if url[1]|length > 50 %}...{% endif %}
                </a>
            </td>
            <td>
                <a href="/r/{{ url[2] }}" target="_blank">{{ url[2] }}</a>
            </td>
            <td>{{ url[5] }}</td>
            <td>
                <form method="post" action="/delete/{{ url[2] }}" style="display:inline;">
                    <button type="submit">Delete</button>
                </form>
                <form method="post" action="/update/{{ url[2] }}" style="display:inline;">
                    <input type="text" name="new_url" placeholder="New URL">
                    <input type="text" name="new_shortCode" placeholder="New short code">
                    <button type="submit">Update</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
